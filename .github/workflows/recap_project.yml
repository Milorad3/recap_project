name: Python Linting Pipeline
on:
  push:
    branches: [ main ]
  # pull_request:
  #   branches: [ main ]
permissions:
  contents: write
jobs:
  Download_repo_and_run_script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        
      - name: Run script
        run: echo "Hello World"
  
  Setup_Python_and_run_test:
    needs: Download_repo_and_run_script
    strategy:
      matrix:
        python-version: [3.14, 3.13, 3.12]
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}


      - name: Run test
        run: pytest tests/  

  Build_Docker_image:
    needs: Setup_Python_and_run_test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build Docker image
        run: | 
           docker build -t milorad86/myy-app:latest .
        #   docker build -t milorad86/myy-app:latest -t milorad86/myy-app:${{github.sha}} .
           


      - name: Push Docker image
        run: |
           docker push milorad86/myy-app:latest
        #  docker push milorad86/myy-app:${{github.sha}}


  Deploy_to_Staging:
    needs: Build_Docker_image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Deploy to Render
        run: |
          curl -fX POST "${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}"
  
  
  Deploy_to_Production:
    needs: Deploy_to_Staging
    environment:
      name: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Deploy to Render
        run: |
          curl -fX POST "${{ secrets.RENDER_PROD_DEPLOY_HOOK }}"
  Notify_on_Failure:
    needs: [Download_repo_and_run_script, Setup_Python_and_run_test, Build_Docker_image, Deploy_to_Staging, Deploy_to_Production]
    if: failure()
    runs-on: ubuntu-latest
    steps:
    - name: Notify on failure
      run: |
        curl -fX POST "${{ secrets.DISCORD_WEBHOOK }}" \
          -H "Content-Type: application/json" \
          -d '{"content": "🔴 Pipeline FAILED\nRepo: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\nAutor: ${{ github.actor }}\nDetalji: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
              
  Create_Release:
    needs: Deploy_to_Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: release-${{ github.sha }}